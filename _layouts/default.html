<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
  {% for css in page.extra_css %}<link rel="stylesheet" href="{{ css }}">
  {% endfor %}<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    // 저장된 테마를 먼저 적용해 깜빡임 방지
    try { var t = localStorage.getItem('cookbook:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">🍳 {{ site.title }}</a>
      <nav class="header-actions">
        <a class="nav-link{% if page.nav == 'places' %}{% else %} active{% endif %}" href="{{ '/' | relative_url }}">레시피</a>
        <a class="nav-link{% if page.nav == 'places' %} active{% endif %}" href="{{ '/places/' | relative_url }}">맛집</a>
        <a class="icon-btn" href="{{ '/' | relative_url }}?fav=1" title="즐겨찾기">★</a>
        <button class="icon-btn" id="theme-toggle" type="button" title="다크/라이트 전환">◐</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer wrap">
    <span>{{ site.recipes | size }}개의 레시피 · {{ site.data.places | size }}곳의 맛집</span>
  </footer>

  <script>
    window.COOKBOOK = { baseurl: {{ site.baseurl | jsonify }} };
  </script>
  <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
</body>
</html>
